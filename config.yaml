      type: http
      behavior: classical
      url: "https://raw.githubusercontent.com/latifangren/CLASH-CONFIG-by-Latifan/main/rule_provider/direct.yaml"
      path: "./rule_provider/direct.yaml"
      interval: 86400
    Umum:
      type: http
      behavior: classical
      url: "https://raw.githubusercontent.com/latifangren/CLASH-CONFIG-by-Latifan/main/rule_provider/umum.yaml"
      path: "./rule_provider/umum.yaml"
      interval: 86400
    Reject:
      type: http
      behavior: classical
      url: "https://raw.githubusercontent.com/latifangren/CLASH-CONFIG-by-Latifan/main/rule_provider/reject.yaml"
      path: "./rule_provider/reject.yaml"
      interval: 86400
    Streaming:
      type: http
      behavior: classical
      url: "https://raw.githubusercontent.com/latifangren/CLASH-CONFIG-by-Latifan/main/rule_provider/streaming.yaml"
      path: "./rule_provider/streaming.yaml"
      interval: 86400
    Games:
      type: http
      behavior: classical
      url: "https://raw.githubusercontent.com/latifangren/CLASH-CONFIG-by-Latifan/main/rule_provider/games.yaml"
      path: "./rule_provider/games.yaml"
      interval: 86400
    Sosmed:
      type: http
      behavior: classical
      url: "https://raw.githubusercontent.com/latifangren/CLASH-CONFIG-by-Latifan/main/rule_provider/sosmed.yaml"
      path: "./rule_provider/sosmed.yaml"
      interval: 86400
    Ewallet:
      type: http
      behavior: classical
      url: "https://raw.githubusercontent.com/latifangren/CLASH-CONFIG-by-Latifan/main/rule_provider/ewallet.yaml"
      path: "./rule_provider/ewallet.yaml"
      interval: 86400
    AdBlock:
      type: http
      behavior: domain
      url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Advertising/Advertising_Domain.yaml"
      path: "./rule_provider/adblock.yaml"
      interval: 86400
    
  # Provider Cloud Configuration
  proxy-providers:
    "provide-id":
      type: file
      path: ./provide/id.yaml
      health-check:
        enable: true
        url: http://www.gstatic.com/generate_204
        interval: 60
        timeout: 5

    "provide-sg":
      type: file
      interval: 7200
      path: ./provide/sg.yaml
      health-check:
        enable: true
        url: http://www.gstatic.com/generate_204
        interval: 60
        timeout: 5
    "provide-us":
      type: file
      interval: 7200
      path: ./provide/us.yaml
      health-check:
        enable: true
        url: http://www.gstatic.com/generate_204
        interval: 60
        timeout: 5

    # Cloudflare WARP WireGuard Provider
    "provide-warp-id":
      type: file
      interval: 7200
      path: ./provide/warp-id.yaml
      health-check:
        enable: true
        url: http://www.gstatic.com/generate_204
        interval: 60
        timeout: 5

    "provide-warp-sg":
      type: file
      interval: 7200
      path: ./provide/warp-sg.yaml
      health-check:
        enable: true
        url: http://www.gstatic.com/generate_204
        interval: 60
        timeout: 5

  proxy-groups:
  - name: AdBlock
    type: select
    disable-udp: false
    proxies:
    - REJECT
    - DIRECT
    - Best Ping
  - name: SG
    type: url-test
    disable-udp: false
    use:
    - provide-sg
  - name: ID
    type: url-test
    disable-udp: false
    use:
    - provide-id
  - name: US
    type: url-test
    disable-udp: false
    use:
    - provide-us
  - name: Ewallet
    type: select
    disable-udp: false
    proxies:
    - DIRECT
    - Best Ping
    - Auto
    - Manual
  - name: Games
    type: select
    disable-udp: false
    proxies:
    - Auto
    - SG
    - ID
    - US
    - Best Ping
    - Manual
    - DIRECT
  - name: Streaming
    type: select
    disable-udp: false
    proxies:
    - DIRECT
    - SG
    - ID
    - US
    - Auto
    - Best Ping
    - Manual
  - name: Sosmed
    type: select
    disable-udp: false
    proxies:
    - DIRECT
    - SG
    - ID
    - US
    - Auto
    - Best Ping
    - Manual
    - WireGuard-Only

  - name: Manual
    type: select
    disable-udp: false
    use:
    - provide-id
    - provide-sg
    - provide-us
    - provide-warp-id
    - provide-warp-sg
  - name: Auto
    type: fallback
    disable-udp: false 
    use:
    - "provide-sg"
    - "provide-id"
    - "provide-us"
    - "provide-warp-id"
    - "provide-warp-sg"
    url: https://cp.cloudflare.com/generate_204
    interval: 20
    tolerance: 50
  - name: Best Ping
    type: url-test
    disable-udp: false
    use:
    - "provide-id"
    - "provide-sg" 
    - "provide-us"
    - "provide-warp-id"
    - "provide-warp-sg"
    url: https://cp.cloudflare.com/generate_204
    interval: 20
    tolerance: 50
    timeout: 5
  - name: WireGuard-Only
    type: select
    disable-udp: false
    use:
    - provide-warp-id
    - provide-warp-sg
  - name: GLOBAL
    type: select
    proxies:
      - DIRECT
      - WireGuard-Only
      - SG
      - ID
      - US
      - Auto
      - Best Ping
      - Manual
    
  dns:
    nameserver:
      - https://dns.adguard.com/dns-query
      - https://dns.google/dns-query
