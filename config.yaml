  redir-port: 9797
  tproxy-port: 9898
  port: 7890
  socks-port: 7891
  mixed-port: 7893
  mode: rule
  log-level: silent
  allow-lan: true
  unified-delay: true
  external-controller: 0.0.0.0:9090 
  # secret: "123456"
  
  bind-address: "*"
  external-ui: /data/adb/box/clash/dashboard
  ipv6: false
  
  rules:
  - DST-PORT,7895,REJECT
  - DST-PORT,7892,REJECT
  - IP-CIDR,198.18.0.1/16,REJECT,no-resolve
  - AND,((NOT,((DST-PORT,80/81/443/8000-8081/21/22/23/81/88/5050/843/182/53))),(NETWORK,UDP)),Games
  - AND,((NOT,((DST-PORT,80/81/443/8000-8081/21/22/23/81/88/5050/843/182/53))),(NETWORK,TCP)),Games
  - AND,((NETWORK,UDP),(OR,((DST-PORT,443),(GEOSITE,youtube)))),REJECT
  
  # Hapus rule Ads atau tambahakan # di depan rule Ads jika menghambat pengalaman browsing dan streaming kalia
  
  # Rule Sets
  - RULE-SET,Direct,DIRECT
  - RULE-SET,Reject,REJECT
  - RULE-SET,AdBlock,AdBlock
  - RULE-SET,Sosmed,Sosmed
  - RULE-SET,Ewallet,Ewallet
  - RULE-SET,Streaming,Streaming
  - RULE-SET,Games,Games
  - RULE-SET,Umum,GLOBAL
  
  # WireGuard specific rules (untuk traffic yang tidak bisa bypass)
  - DOMAIN-SUFFIX,cloudflare.com,WireGuard-Only
  - DOMAIN-SUFFIX,warp.plus,WireGuard-Only
  - DOMAIN-SUFFIX,1.1.1.1,WireGuard-Only
  
  - MATCH,GLOBAL
  
  experimental:
    ignore-resolve-fail: true
    sniff-tls-sni: true
    tracing: false
    
  hosts:
    localhost: 127.0.0.1
    
  profile:
    store-selected: true
    store-fake-ip: true
    
  sniffer:
    enable: true
    parse-pure-ip: true
    
  tcp-concurrent: true
  geodata-loader: memconservative
  keep-alive-interval: 30
  global-client-fingerprint: chrome
  keep-alive-idle: 300
  
  # Konfigurasi TUN
  tun:
    enable: false
    stack: system
    dns-hijack:
      - any:53
    auto-route: true
    auto-detect-interface: true
    device: meta
    mtu: 1500